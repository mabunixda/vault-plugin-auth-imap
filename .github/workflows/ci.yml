name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  GOVERSION: "1.24"

permissions:
  contents: write
  pull-requests: read

jobs:
  prebuild:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.semrel.outputs.version }}
      currentDate: ${{ steps.info_date.outputs.date }}

    steps:
      - name: Gather Information - Date
        id: info_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5

      - name: Check pre-commit presence
        if: success() && !startsWith(github.ref, 'refs/tags/')
        id: precommit_exists
        uses: andstor/file-existence-action@v3
        with:
          files: ".pre-commit-config.yaml"

      - uses: actions/setup-python@v5
        if: steps.precommit_exists.outputs.files_exists == 'true' && !startsWith(github.ref, 'refs/tags/')

      - uses: actions/setup-go@v5
        if: steps.precommit_exists.outputs.files_exists == 'true' && !startsWith(github.ref, 'refs/tags/')
        with:
          go-version: ${{ env.GOVERSION }}
          cache: false

      - uses: pre-commit/action@v3.0.0
        if: steps.precommit_exists.outputs.files_exists == 'true' && !startsWith(github.ref, 'refs/tags/')

      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prepend: true
          dry: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          cd internal/imapauth
          go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          cd internal/imapauth
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70.0" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 70% threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: internal/imapauth/coverage.out

  goreleaser:
    needs: [prebuild, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: false

      - name: build prepare
        id: build_prepare
        run: |
          echo LD_FLAGS=$(make ldflags)  >> "$GITHUB_OUTPUT"
          makeTarget=snapshot
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            makeTarget=release
          fi
          echo BUILD_FLAGS="$(grep -A1 "${makeTarget}:"  Makefile | awk -F 'goreleaser' '{print $2}' | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: CI Builds
        id: build
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LD_FLAGS: ${{ steps.build_prepare.outputs.LD_FLAGS }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.build_prepare.outputs.BUILD_FLAGS }}

      - name: Upload assets
        if: success() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: vault-plugin-auth-imap
          path: dist/*

  release:
    needs: [prebuild, goreleaser]
    if: github.event_name != 'pull_request' && success() && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-semantic-release/action@v1
        id: generate_changelog
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prepend: true
          changelog-file: CHANGELOG.md

      - name: Update changelog
        uses: stefanzweifel/git-auto-commit-action@v6
        if: steps.generate_changelog.outputs.version != ''
        with:
          commit_message: "[skip ci] update changelog - ${{ steps.generate_changelog.outputs.version }}"
          file_pattern: CHANGELOG.md
