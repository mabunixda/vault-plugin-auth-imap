name: CI

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
    branches: ["main"]

env:
  GOVERSION: "1.24"

permissions:
  contents: write # Create releases, commit changelog updates
  pull-requests: read # Read PR information for context
  actions: write # Upload artifacts (coverage, build artifacts)
  checks: write # Report workflow status and test results
  packages: write # Publish packages if using goreleaser with registries

jobs:
  prebuild:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v5

      - name: Check pre-commit presence
        id: precommit_exists
        uses: andstor/file-existence-action@v3
        with:
          files: ".pre-commit-config.yaml"

      - uses: actions/setup-python@v5
        if: steps.precommit_exists.outputs.files_exists == 'true'

      - uses: actions/setup-go@v5
        if: steps.precommit_exists.outputs.files_exists == 'true'
        with:
          go-version: ${{ env.GOVERSION }}
          cache: false

      - uses: pre-commit/action@v3.0.0
        if: steps.precommit_exists.outputs.files_exists == 'true'

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          cd internal/imapauth
          go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          cd internal/imapauth
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70.0" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 70% threshold"
            exit 1
          fi

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: internal/imapauth/coverage.out

  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: false

      - name: build prepare
        id: build_prepare
        run: |
          echo LD_FLAGS=$(make ldflags)  >> "$GITHUB_OUTPUT"
          makeTarget=snapshot
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            makeTarget=release
          fi
          echo BUILD_FLAGS="$(grep -A1 "${makeTarget}:"  Makefile | awk -F 'goreleaser' '{print $2}' | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: CI Builds
        id: build
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LD_FLAGS: ${{ steps.build_prepare.outputs.LD_FLAGS }}
          RELEASE: ${{ github.ref_type == 'tag' && '1' || '' }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.build_prepare.outputs.BUILD_FLAGS }}

      - name: Upload snapshot artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vault-plugin-auth-imap
          path: dist/*

  release:
    needs: [prebuild, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-semantic-release/action@v1
        id: generate_changelog
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prepend: true
          changelog-file: CHANGELOG.md

      - name: Update changelog
        uses: stefanzweifel/git-auto-commit-action@v6
        if: steps.generate_changelog.outputs.version != ''
        with:
          commit_message: "[skip ci] update changelog - ${{ steps.generate_changelog.outputs.version }}"
          file_pattern: CHANGELOG.md
