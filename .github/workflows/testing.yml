---
name: Testing

permissions:
  contents: read # Read repository content and code
  checks: write # Write test results as check runs
  pull-requests: read # Read PR information for context
  actions: read # Read workflow artifacts if needed

on:
  push:
    branches: ["**", "!main"]

jobs:
  testing:
    name: Testing build

    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup tools via mise (Linux/macOS)
        uses: jdx/mise-action@v4
        if: runner.os != 'Windows'

      - name: Setup tools via mise (Windows)
        uses: jdx/mise-action@v4
        if: runner.os == 'Windows'
        with:
          install: false

      - name: Install Go via mise (Windows)
        if: runner.os == 'Windows'
        run: mise install go

      - name: Test
        run: make test
