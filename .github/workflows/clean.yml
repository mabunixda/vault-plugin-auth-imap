---
name: Clean Go

permissions:
  contents: read # Read repository content and code
  pull-requests: read # Read PR information (if needed for context)
  checks: write # Write check results (for status checks)

on:
  push:
    branches: ["**", "!main"]

jobs:
  clean:
    name: Clean
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup tools via mise
        uses: jdx/mise-action@v4

      - name: Assets
        run: make assets

      - name: Porcelain
        run: make porcelain
